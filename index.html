<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作手记 — 任务日历 & 灵感库</title>
<style>
/* ====== Reset & Base ====== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --border: #e8eaf0;
  --text: #1a1d29;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --primary: #6366f1;
  --primary-light: #e0e0ff;
  --primary-dark: #4f46e5;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 8px;
  --transition: .22s cubic-bezier(.4,0,.2,1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ====== Layout ====== */
.app { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

/* ====== Header ====== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--primary), #818cf8);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(99,102,241,.3);
}
.logo-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.logo-sub { font-size: 12px; color: var(--text-3); }

.header-date {
  font-size: 13px;
  color: var(--text-2);
  background: var(--surface);
  padding: 8px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  font-weight: 500;
}
.section-gap { margin-top: 28px; }
.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}
.nav-tabs {
  display: flex;
  background: var(--surface);
  border-radius: 12px;
  padding: 4px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.nav-tab {
  padding: 8px 20px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  border-radius: 8px;
  transition: var(--transition);
  display: flex; align-items: center; gap: 6px;
}
.nav-tab.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.3); }
.nav-tab:not(.active):hover { background: var(--surface-2); }

/* ====== Stats Bar ====== */
.stats-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.stat-card {
  flex: 1;
  min-width: 140px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  transition: var(--transition);
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.stat-icon.blue { background: #e0e7ff; }
.stat-icon.amber { background: #fef3c7; }
.stat-icon.green { background: #d1fae5; }
.stat-value { font-size: 22px; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-3); }

/* ====== Calendar ====== */
.calendar-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.cal-title { font-size: 18px; font-weight: 700; }
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-2);
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.cal-btn:hover { background: var(--surface-2); border-color: var(--primary); color: var(--primary); }
.cal-today-btn {
  padding: 6px 16px; font-size: 13px; font-weight: 500;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; transition: var(--transition);
}
.cal-today-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--surface-2);
}
.cal-weekday {
  padding: 10px 0;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
}
.cal-weekday.weekend { color: var(--accent); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.cal-cell {
  min-height: 92px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:hover { background: var(--surface-2); }
.cal-cell.other-month { opacity: .35; }
.cal-cell.today .cal-date {
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.cal-date {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  width: fit-content;
}
.cal-cell.other-month .cal-date { color: var(--text-3); }

.cal-task-chip {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--primary-light);
  color: var(--primary-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: var(--transition);
  border-left: 3px solid var(--primary);
}
.cal-task-chip.done {
  background: #d1fae5;
  color: #065f46;
  border-left-color: var(--success);
  text-decoration: line-through;
  opacity: .7;
}
.cal-task-chip.high { border-left-color: var(--danger); background: #fee2e2; color: #991b1b; }
.cal-task-chip.medium { border-left-color: var(--accent); background: #fef3c7; color: #92400e; }
.cal-task-chip:hover { transform: translateX(2px); }
.cal-more {
  font-size: 10px;
  color: var(--text-3);
  text-align: center;
  cursor: pointer;
}

/* ====== Day Panel (Modal) ====== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .2s ease;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp .25s ease;
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px;
  border: none; background: var(--surface-2);
  border-radius: 8px; cursor: pointer;
  font-size: 18px; color: var(--text-2);
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #fee2e2; color: var(--danger); }

.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

/* Task input */
.task-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.task-input {
  flex: 1;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: var(--transition);
  outline: none;
  font-family: inherit;
}
.task-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

.priority-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.priority-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.priority-option {
  padding: 4px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  background: var(--surface);
}
.priority-option.selected.high { border-color: var(--danger); background: #fee2e2; color: #991b1b; }
.priority-option.selected.medium { border-color: var(--accent); background: #fef3c7; color: #92400e; }
.priority-option.selected.low { border-color: var(--success); background: #d1fae5; color: #065f46; }
.priority-option:not(.selected):hover { border-color: var(--primary); }

.add-task-btn {
  padding: 10px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.add-task-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

/* Task list in modal */
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.task-item:hover { box-shadow: var(--shadow); }
.task-item.done .task-text { text-decoration: line-through; color: var(--text-3); }

.task-checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.task-checkbox.checked { background: var(--success); border-color: var(--success); }
.task-checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }

.task-priority-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.task-priority-dot.high { background: var(--danger); }
.task-priority-dot.medium { background: var(--accent); }
.task-priority-dot.low { background: var(--success); }

.task-text { flex: 1; font-size: 14px; word-break: break-word; }

.task-delete {
  width: 26px; height: 26px;
  border: none; background: none;
  border-radius: 6px; cursor: pointer;
  color: var(--text-3);
  font-size: 14px;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
}
.task-item:hover .task-delete { opacity: 1; }
.task-delete:hover { background: #fee2e2; color: var(--danger); }

.empty-state {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-3);
}
.empty-state-icon { font-size: 36px; margin-bottom: 8px; }
.empty-state-text { font-size: 14px; }

/* ====== Inspiration Library ====== */
/* ====== Life Todo Board ====== */
.life-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.life-input-bar {
  display: flex;
  gap: 10px;
  padding: 16px 20px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
}
.life-input {
  flex: 1;
  min-width: 160px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}
.life-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.life-cat-select {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  background: var(--surface);
  font-family: inherit;
  outline: none;
}
.life-cat-select:focus { border-color: var(--primary); }
.life-add-btn {
  padding: 10px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.life-add-btn:hover { background: var(--primary-dark); }
.life-progress {
  height: 4px;
  background: var(--border);
  overflow: hidden;
}
.life-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #34d399);
  width: 0%;
  transition: width .4s ease;
  border-radius: 0 2px 2px 0;
}
.life-filters {
  display: flex;
  gap: 6px;
  padding: 12px 20px 0;
  flex-wrap: wrap;
}
.life-list {
  padding: 12px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 420px;
  overflow-y: auto;
}
.life-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.life-item:hover { box-shadow: var(--shadow); border-color: var(--primary-light); }
.life-item.done .life-text { text-decoration: line-through; color: var(--text-3); }
.life-item.done { opacity: .65; }
.life-checkbox {
  width: 22px; height: 22px;
  border: 2px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.life-checkbox.checked { background: var(--success); border-color: var(--success); }
.life-checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
.life-cat-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
}
.life-text { flex: 1; font-size: 14px; word-break: break-word; }
.life-time { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.life-delete {
  width: 26px; height: 26px;
  border: none; background: none;
  border-radius: 6px; cursor: pointer;
  color: var(--text-3); font-size: 14px;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; flex-shrink: 0;
}
.life-item:hover .life-delete { opacity: 1; }
.life-delete:hover { background: #fee2e2; color: var(--danger); }

.inspiration-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}

.ins-capture {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.ins-capture-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.ins-input {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: var(--transition);
  outline: none;
  font-family: inherit;
  resize: vertical;
  min-height: 44px;
}
.ins-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

.ins-capture-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ins-tag-select {
  padding: 6px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  background: var(--surface);
}
.ins-tag-select:hover { border-color: var(--primary); }
.ins-color-pick { display: flex; gap: 6px; }
.color-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: var(--transition);
}
.color-dot.selected { border-color: var(--text); transform: scale(1.15); }
.color-dot:hover { transform: scale(1.1); }

.ins-add-btn {
  margin-left: auto;
  padding: 8px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.ins-add-btn:hover { background: var(--primary-dark); }

.ins-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.ins-search {
  flex: 1;
  min-width: 180px;
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}
.ins-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

.filter-chip {
  padding: 5px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  background: var(--surface);
  white-space: nowrap;
}
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-chip:not(.active):hover { border-color: var(--primary); color: var(--primary); }

.ins-list {
  padding: 20px 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  max-height: 600px;
  overflow-y: auto;
}

.ins-card {
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: var(--transition);
  position: relative;
  border-left: 4px solid var(--primary);
  animation: slideUp .3s ease;
}
.ins-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.ins-card .ins-content {
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
  margin-bottom: 10px;
}
.ins-card .ins-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ins-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary-dark);
  font-weight: 500;
}
.ins-time { font-size: 11px; color: var(--text-3); }
.ins-delete {
  position: absolute;
  top: 8px; right: 8px;
  width: 24px; height: 24px;
  border: none; background: var(--surface-2);
  border-radius: 6px; cursor: pointer;
  color: var(--text-3); font-size: 13px;
  opacity: 0; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.ins-card:hover .ins-delete { opacity: 1; }
.ins-delete:hover { background: #fee2e2; color: var(--danger); }

/* ====== View Toggle ====== */
.view { display: none; }
.view.active { display: block; animation: fadeIn .3s ease; }

/* ====== Responsive ====== */
@media (max-width: 640px) {
  .app { padding: 16px 12px 40px; }
  .header { flex-direction: column; align-items: stretch; }
  .cal-cell { min-height: 64px; padding: 4px; }
  .cal-task-chip { font-size: 10px; padding: 1px 4px; }
  .ins-list { grid-template-columns: 1fr; }
  .life-input-bar { flex-direction: column; align-items: stretch; }
  .stats-bar { flex-direction: column; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: #fff;
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 200;
  transition: .3s ease;
  opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="logo-title">工作手记</div>
        <div class="logo-sub">工作任务 · 生活待办 · 灵感捕捉</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div class="header-date" id="headerDate"></div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-view="work">💼 工作</button>
        <button class="nav-tab" data-view="life">🌿 生活</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon blue">📋</div>
      <div>
        <div class="stat-value" id="statTodayTasks">0</div>
        <div class="stat-label">今日任务</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">✅</div>
      <div>
        <div class="stat-value" id="statDoneTasks">0</div>
        <div class="stat-label">已完成</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">🌿</div>
      <div>
        <div class="stat-value" id="statLifeTodos">0</div>
        <div class="stat-label">生活待办</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">💡</div>
      <div>
        <div class="stat-value" id="statInspirations">0</div>
        <div class="stat-label">灵感总数</div>
      </div>
    </div>
  </div>

  <!-- ====== Work Page ====== -->
  <div class="view active" id="view-work">
    <!-- Calendar -->
    <div class="calendar-wrap">
      <div class="cal-header">
        <div class="cal-title" id="calTitle">2026年7月</div>
        <div class="cal-nav">
          <button class="cal-today-btn" onclick="goToday()">今天</button>
          <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
          <button class="cal-btn" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div class="cal-weekday weekend">日</div>
        <div class="cal-weekday">一</div>
        <div class="cal-weekday">二</div>
        <div class="cal-weekday">三</div>
        <div class="cal-weekday">四</div>
        <div class="cal-weekday">五</div>
        <div class="cal-weekday weekend">六</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- Inspiration Library -->
    <div class="section-gap"></div>
    <div class="section-label">💡 灵感库</div>
    <div class="inspiration-wrap">
      <div class="ins-capture">
        <div class="ins-capture-row">
          <textarea class="ins-input" id="insInput" placeholder="随手记下你的灵感、想法、待办碎片…" rows="2"></textarea>
        </div>
        <div class="ins-capture-meta">
          <select class="ins-tag-select" id="insTagSelect">
            <option value="想法">💭 想法</option>
            <option value="工作">💼 工作</option>
            <option value="学习">📚 学习</option>
            <option value="生活">🌿 生活</option>
            <option value="待办">📌 待办</option>
          </select>
          <div class="ins-color-pick" id="colorPick">
            <div class="color-dot selected" style="background:#6366f1" data-color="#6366f1"></div>
            <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b"></div>
            <div class="color-dot" style="background:#10b981" data-color="#10b981"></div>
            <div class="color-dot" style="background:#ef4444" data-color="#ef4444"></div>
            <div class="color-dot" style="background:#ec4899" data-color="#ec4899"></div>
            <div class="color-dot" style="background:#64748b" data-color="#64748b"></div>
          </div>
          <button class="ins-add-btn" onclick="addInspiration()">记录灵感</button>
        </div>
      </div>
      <div class="ins-filters">
        <input type="text" class="ins-search" id="insSearch" placeholder="🔍 搜索灵感…">
        <div id="tagFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      </div>
      <div class="ins-list" id="insList"></div>
    </div>
  </div>

  <!-- ====== Life Page ====== -->
  <div class="view" id="view-life">
    <div class="section-label">🌿 生活待办</div>
    <div class="life-wrap">
      <div class="life-input-bar">
        <input type="text" class="life-input" id="lifeInput" placeholder="添加一个生活待办…" onkeydown="if(event.key==='Enter')addLifeTodo()">
        <select class="life-cat-select" id="lifeCatSelect">
          <option value="购物">🛒 购物</option>
          <option value="家务">🧹 家务</option>
          <option value="健康">💪 健康</option>
          <option value="社交">👥 社交</option>
          <option value="其他">📌 其他</option>
        </select>
        <button class="life-add-btn" onclick="addLifeTodo()">添加</button>
      </div>
      <div class="life-progress">
        <div class="life-progress-bar" id="lifeProgressBar"></div>
      </div>
      <div class="life-filters" id="lifeFilters"></div>
      <div class="life-list" id="lifeList"></div>
    </div>
  </div>
</div>

<!-- Day Modal -->
<div class="modal-overlay" id="dayModal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">任务</div>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">
      <div class="task-input-row">
        <input type="text" class="task-input" id="taskInput" placeholder="添加一个任务…" onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="priority-row">
        <span class="priority-label">优先级：</span>
        <span class="priority-option low selected" data-priority="low" onclick="selectPriority(this)">低</span>
        <span class="priority-option medium" data-priority="medium" onclick="selectPriority(this)">中</span>
        <span class="priority-option high" data-priority="high" onclick="selectPriority(this)">高</span>
        <button class="add-task-btn" onclick="addTask()" style="margin-left:auto;">添加</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ====== Data Layer ====== */
const STORE_KEY = 'workbuddy_notes_v1';
let store = { tasks: {}, inspirations: [], lifeTodos: [] };

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) store = JSON.parse(raw);
    if (!store.tasks) store.tasks = {};
    if (!store.inspirations) store.inspirations = [];
    if (!store.lifeTodos) store.lifeTodos = [];
  } catch(e) { store = { tasks: {}, inspirations: [], lifeTodos: [] }; }
}
function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

/* ====== Date Utils ====== */
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr() { return fmtDate(new Date()); }

/* ====== Calendar ====== */
let calYear, calMonth; // 0-based month
let selectedDate = null;
let selectedPriority = 'low';

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function renderCalendar() {
  const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calTitle').textContent = `${calYear}年 ${months[calMonth]}`;
  
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLast = new Date(calYear, calMonth, 0).getDate();
  
  const today = todayStr();
  const cells = [];
  
  // Previous month tail
  for (let i = startWeekday - 1; i >= 0; i--) {
    const d = prevMonthLast - i;
    const date = new Date(calYear, calMonth - 1, d);
    cells.push({ date, other: true });
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    cells.push({ date, other: false });
  }
  // Next month head (fill to 42 cells = 6 rows)
  const remaining = 42 - cells.length;
  for (let d = 1; d <= remaining; d++) {
    const date = new Date(calYear, calMonth + 1, d);
    cells.push({ date, other: true });
  }
  
  cells.forEach(cell => {
    const dateStr = fmtDate(cell.date);
    const isToday = dateStr === today;
    const tasks = store.tasks[dateStr] || [];
    
    const el = document.createElement('div');
    el.className = 'cal-cell';
    if (cell.other) el.classList.add('other-month');
    if (isToday) el.classList.add('today');
    el.onclick = () => openDayModal(dateStr);
    
    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = cell.date.getDate();
    el.appendChild(dateEl);
    
    // Show up to 3 tasks
    const visible = tasks.slice(0, 3);
    visible.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'cal-task-chip';
      if (t.done) chip.classList.add('done');
      if (t.priority === 'high') chip.classList.add('high');
      else if (t.priority === 'medium') chip.classList.add('medium');
      chip.textContent = t.text;
      chip.onclick = (e) => { e.stopPropagation(); toggleTask(dateStr, t.id); };
      el.appendChild(chip);
    });
    if (tasks.length > 3) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = `+${tasks.length - 3} 更多`;
      more.onclick = (e) => { e.stopPropagation(); openDayModal(dateStr); };
      el.appendChild(more);
    }
    
    grid.appendChild(el);
  });
  
  updateStats();
}

/* ====== Day Modal ====== */
function openDayModal(dateStr) {
  selectedDate = dateStr;
  const d = new Date(dateStr);
  const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('modalTitle').textContent = 
    `${d.getMonth()+1}月${d.getDate()}日 · ${weekDays[d.getDay()]}`;
  document.getElementById('taskInput').value = '';
  selectedPriority = 'low';
  document.querySelectorAll('.priority-option').forEach(o => {
    o.classList.remove('selected');
    if (o.dataset.priority === 'low') o.classList.add('selected');
  });
  renderTaskList();
  document.getElementById('dayModal').classList.add('show');
  setTimeout(() => document.getElementById('taskInput').focus(), 100);
}

function closeModal(e) {
  if (e.target === e.currentTarget) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('dayModal').classList.remove('show');
}

function selectPriority(el) {
  document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedPriority = el.dataset.priority;
}

function addTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text || !selectedDate) return;
  
  if (!store.tasks[selectedDate]) store.tasks[selectedDate] = [];
  store.tasks[selectedDate].push({
    id: Date.now().toString(),
    text,
    priority: selectedPriority,
    done: false,
    created: Date.now()
  });
  saveData();
  input.value = '';
  renderTaskList();
  renderCalendar();
  showToast('任务已添加 ✓');
}

function toggleTask(dateStr, taskId) {
  const tasks = store.tasks[dateStr];
  if (!tasks) return;
  const t = tasks.find(x => x.id === taskId);
  if (t) {
    t.done = !t.done;
    saveData();
    renderTaskList();
    renderCalendar();
  }
}

function deleteTask(dateStr, taskId) {
  if (!store.tasks[dateStr]) return;
  store.tasks[dateStr] = store.tasks[dateStr].filter(x => x.id !== taskId);
  if (store.tasks[dateStr].length === 0) delete store.tasks[dateStr];
  saveData();
  renderTaskList();
  renderCalendar();
  showToast('任务已删除');
}

function renderTaskList() {
  const list = document.getElementById('taskList');
  const tasks = store.tasks[selectedDate] || [];
  list.innerHTML = '';
  
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌱</div><div class="empty-state-text">今天还没有任务，添加一个吧</div></div>';
    return;
  }
  
  // Sort: undone first, then by priority
  const priorityOrder = { high: 0, medium: 1, low: 2 };
  const sorted = [...tasks].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return priorityOrder[a.priority] - priorityOrder[b.priority];
  });
  
  sorted.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task-item';
    if (t.done) el.classList.add('done');
    
    el.innerHTML = `
      <div class="task-checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask('${selectedDate}','${t.id}')"></div>
      <div class="task-priority-dot ${t.priority}"></div>
      <div class="task-text">${escapeHtml(t.text)}</div>
      <button class="task-delete" onclick="deleteTask('${selectedDate}','${t.id}')">🗑</button>
    `;
    list.appendChild(el);
  });
}

/* ====== Life Todo Board ====== */
let lifeActiveCat = 'all';
const lifeCats = [
  { label: '购物', emoji: '🛒', color: '#f59e0b' },
  { label: '家务', emoji: '🧹', color: '#6366f1' },
  { label: '健康', emoji: '💪', color: '#10b981' },
  { label: '社交', emoji: '👥', color: '#ec4899' },
  { label: '其他', emoji: '📌', color: '#64748b' },
];

function renderLifeFilters() {
  const container = document.getElementById('lifeFilters');
  container.innerHTML = '';
  const chips = [{ label: '全部', value: 'all', emoji: '📋', color: '#6366f1' }, ...lifeCats.map(c => ({ label: c.label, value: c.label, emoji: c.emoji, color: c.color }))];
  chips.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (lifeActiveCat === c.value ? ' active' : '');
    chip.textContent = c.emoji + ' ' + c.label;
    chip.onclick = () => { lifeActiveCat = c.value; renderLifeFilters(); renderLifeTodos(); };
    container.appendChild(chip);
  });
}

function addLifeTodo() {
  const input = document.getElementById('lifeInput');
  const text = input.value.trim();
  if (!text) return;
  const cat = document.getElementById('lifeCatSelect').value;
  store.lifeTodos.unshift({
    id: Date.now().toString(),
    text,
    category: cat,
    done: false,
    created: Date.now()
  });
  saveData();
  input.value = '';
  renderLifeTodos();
  updateStats();
  showToast('已添加到生活待办 ✓');
}

function toggleLifeTodo(id) {
  const t = store.lifeTodos.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    saveData();
    renderLifeTodos();
    updateStats();
  }
}

function deleteLifeTodo(id) {
  store.lifeTodos = store.lifeTodos.filter(x => x.id !== id);
  saveData();
  renderLifeTodos();
  updateStats();
  showToast('已删除');
}

function renderLifeTodos() {
  const list = document.getElementById('lifeList');
  let items = store.lifeTodos;
  if (lifeActiveCat !== 'all') items = items.filter(x => x.category === lifeActiveCat);

  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌿</div><div class="empty-state-text">还没有生活待办，添加一个吧</div></div>';
    updateLifeProgress();
    return;
  }

  // Sort: undone first
  const sorted = [...items].sort((a, b) => a.done ? 1 : -1);

  sorted.forEach(t => {
    const catInfo = lifeCats.find(c => c.label === t.category) || lifeCats[4];
    const el = document.createElement('div');
    el.className = 'life-item' + (t.done ? ' done' : '');
    el.innerHTML = `
      <div class="life-checkbox ${t.done ? 'checked' : ''}" onclick="toggleLifeTodo('${t.id}')"></div>
      <span class="life-cat-tag" style="background:${catInfo.color}1a;color:${catInfo.color}">${catInfo.emoji} ${t.category}</span>
      <div class="life-text">${escapeHtml(t.text)}</div>
      <span class="life-time">${formatTime(t.created)}</span>
      <button class="life-delete" onclick="deleteLifeTodo('${t.id}')">🗑</button>
    `;
    list.appendChild(el);
  });
  updateLifeProgress();
}

function updateLifeProgress() {
  const all = store.lifeTodos;
  const total = all.length;
  const done = all.filter(x => x.done).length;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('lifeProgressBar').style.width = pct + '%';
}

/* ====== Inspiration Library ====== */
let activeTag = 'all';
let selectedColor = '#6366f1';
const allTags = ['想法','工作','学习','生活','待办'];

function renderTagFilters() {
  const container = document.getElementById('tagFilters');
  container.innerHTML = '';
  const chips = [{ label: '全部', value: 'all' }, ...allTags.map(t => ({ label: t, value: t }))];
  chips.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (activeTag === c.value ? ' active' : '');
    chip.textContent = c.label;
    chip.onclick = () => { activeTag = c.value; renderTagFilters(); renderInspirations(); };
    container.appendChild(chip);
  });
}

function addInspiration() {
  const input = document.getElementById('insInput');
  const text = input.value.trim();
  if (!text) return;
  const tag = document.getElementById('insTagSelect').value;
  
  store.inspirations.unshift({
    id: Date.now().toString(),
    text,
    tag,
    color: selectedColor,
    created: Date.now()
  });
  saveData();
  input.value = '';
  renderInspirations();
  updateStats();
  showToast('灵感已记录 ✓');
}

function deleteInspiration(id) {
  store.inspirations = store.inspirations.filter(x => x.id !== id);
  saveData();
  renderInspirations();
  updateStats();
  showToast('已删除');
}

function renderInspirations() {
  const list = document.getElementById('insList');
  const search = document.getElementById('insSearch').value.toLowerCase();
  
  let items = store.inspirations;
  if (activeTag !== 'all') items = items.filter(x => x.tag === activeTag);
  if (search) items = items.filter(x => x.text.toLowerCase().includes(search));
  
  list.innerHTML = '';
  
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">💭</div><div class="empty-state-text">还没有灵感记录，写下第一个吧</div></div>';
    return;
  }
  
  items.forEach(ins => {
    const el = document.createElement('div');
    el.className = 'ins-card';
    el.style.borderLeftColor = ins.color;
    el.innerHTML = `
      <button class="ins-delete" onclick="deleteInspiration('${ins.id}')">×</button>
      <div class="ins-content">${escapeHtml(ins.text)}</div>
      <div class="ins-meta">
        <span class="ins-tag" style="background:${ins.color}22;color:${ins.color}">${ins.tag}</span>
        <span class="ins-time">${formatTime(ins.created)}</span>
      </div>
    `;
    list.appendChild(el);
  });
}

/* ====== Stats ====== */
function updateStats() {
  const today = todayStr();
  const todayTasks = store.tasks[today] || [];
  const done = todayTasks.filter(t => t.done).length;
  document.getElementById('statTodayTasks').textContent = todayTasks.length;
  document.getElementById('statDoneTasks').textContent = done;
  document.getElementById('statInspirations').textContent = store.inspirations.length;
  const lifePending = store.lifeTodos.filter(x => !x.done).length;
  document.getElementById('statLifeTodos').textContent = lifePending;
}

/* ====== Helpers ====== */
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  if (diff < 604800) return Math.floor(diff/86400) + '天前';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ====== View Switching ====== */
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

/* ====== Color Picker ====== */
document.querySelectorAll('.color-dot').forEach(dot => {
  dot.onclick = () => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
    selectedColor = dot.dataset.color;
  };
});

/* ====== Search ====== */
document.getElementById('insSearch').oninput = () => renderInspirations();

/* ====== Keyboard Shortcuts ====== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModalDirect();
  // Ctrl/Cmd + K to switch to work page and focus inspiration input
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.querySelector('.nav-tab[data-view="work"]').click();
    setTimeout(() => {
      document.getElementById('insInput').focus();
      document.getElementById('insInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
  // Ctrl/Cmd + L to switch to life page and focus life todo input
  if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
    e.preventDefault();
    document.querySelector('.nav-tab[data-view="life"]').click();
    setTimeout(() => document.getElementById('lifeInput').focus(), 150);
  }
});

/* ====== Init ====== */
loadData();
initCalendar();
renderTagFilters();
renderInspirations();
renderLifeFilters();
renderLifeTodos();
updateStats();
updateHeaderDate();

function updateHeaderDate() {
  const now = new Date();
  const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('headerDate').textContent = 
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${weekDays[now.getDay()]}`;
}
</script>
